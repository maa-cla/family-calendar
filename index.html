<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家族カレンダー</title>
<meta name="theme-color" content="#fbf8f4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家族カレンダー">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="nav">
    <button id="prevBtn" class="icon-btn" aria-label="前へ">‹</button>
    <h1 id="monthTitle"></h1>
    <button id="nextBtn" class="icon-btn" aria-label="次へ">›</button>
    <button id="todayBtn" class="pill">今日</button>
  </div>
  <div class="actions">
    <span id="status" class="status"></span>
    <button id="viewBtn" class="pill">リスト</button>
    <button id="refreshBtn" class="icon-btn" aria-label="更新">⟳</button>
    <button id="settingsBtn" class="icon-btn" aria-label="設定">⚙︎</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>
<div id="legend" class="legend"></div>

<main class="layout">
  <section id="calendarPane" class="calendar-pane">
    <div class="weekdays"><span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span></div>
    <div id="grid" class="grid"></div>
  </section>
  <section id="listPane" class="list-pane" hidden></section>
  <aside id="dayPane" class="day-pane"></aside>
</main>

<button id="fab" class="fab" aria-label="予定を追加">＋</button>

<!-- 予定の追加・編集 -->
<dialog id="editor" class="sheet">
  <form id="editorForm" method="dialog" novalidate>
    <div class="sheet-head">
      <button type="button" class="link" data-close>キャンセル</button>
      <h2 id="editorTitle">予定を追加</h2>
      <button type="submit" id="saveBtn" class="link strong">保存</button>
    </div>
    <div class="sheet-body">
      <label class="field"><span>タイトル</span>
        <input name="title" autocomplete="off" placeholder="例: サッカー練習"></label>
      <div class="field"><span>カテゴリ</span>
        <div id="catChips" class="chips-select"></div>
        <p id="catHint" class="hint"></p>
      </div>
      <label class="switch-row"><span>終日</span><input type="checkbox" name="allDay"></label>
      <div class="row2">
        <label class="field"><span>開始日</span><input type="date" name="startDate"></label>
        <label class="field timed"><span>開始時刻</span><input type="time" name="startTime" step="300"></label>
      </div>
      <div class="row2">
        <label class="field"><span>終了日</span><input type="date" name="endDate"></label>
        <label class="field timed"><span>終了時刻</span><input type="time" name="endTime" step="300"></label>
      </div>
      <label class="field"><span>場所</span><input name="location" autocomplete="off"></label>
      <label class="field"><span>メモ</span><textarea name="description" rows="4"></textarea></label>
      <p id="editorInfo" class="hint"></p>
      <button type="button" id="deleteBtn" class="danger">この予定を削除</button>
    </div>
  </form>
</dialog>

<!-- 設定 -->
<dialog id="settings" class="sheet wide">
  <form id="settingsForm" method="dialog" novalidate>
    <div class="sheet-head">
      <button type="button" class="link" data-close>閉じる</button>
      <h2>設定</h2>
      <button type="submit" class="link strong">保存</button>
    </div>
    <div class="sheet-body">
      <h3>Googleカレンダーとの接続</h3>
      <p class="hint">セットアップ手順書で作った「ウェブアプリのURL」と「合言葉」を入力します。空欄のままだとデモ表示になります。</p>
      <label class="field"><span>ウェブアプリのURL</span>
        <input name="url" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <label class="field"><span>合言葉</span>
        <input name="token" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <button type="button" id="testBtn" class="secondary">接続テスト</button>
      <p id="testResult" class="hint"></p>

      <h3>夫のGoogleアカウント</h3>
      <p class="hint">「夫を招待」がオンのカテゴリの予定に、自動で招待が送られます。</p>
      <label class="field"><span>メールアドレス</span>
        <input name="husbandEmail" type="email" inputmode="email" autocomplete="off" placeholder="example@gmail.com"></label>

      <h3>カテゴリと色分けのルール</h3>
      <p class="hint">上から順にチェックします。キーワードが予定の「タイトル・メモ・場所」に入っていれば、そのカテゴリの色になります。キーワードは「、」区切りで入力します。</p>
      <div id="catEditor"></div>
      <button type="button" id="addCatBtn" class="secondary">＋ カテゴリを追加</button>
      <label class="field"><span>どれにも当てはまらない予定</span><select name="defaultCategory"></select></label>

      <h3>メンテナンス</h3>
      <button type="button" id="syncNowBtn" class="secondary">Googleカレンダーの予定に今すぐ色分け・招待を反映</button>
      <p class="hint">保存したルールは10分以内に自動で反映されます。急ぐときに押してください。</p>
      <button type="button" id="clearCacheBtn" class="secondary">この端末に保存した予定を消して読み込み直す</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
